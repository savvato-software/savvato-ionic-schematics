<ion-header>
    <ion-toolbar>
        <ion-title>List All <%= classify(name) %>s Page</ion-title>
        <ion-buttons slot="end">
            <ion-button color="tertiary" (click)="onCreateBtnClicked()">Create</ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content>
    <ion-card
            *ngFor="let item of getListOf<%= classify(name) %>s()"
            (click)="on<%= classify(name) %>Click(item)"
    >
        <ion-card-header>
            <!-- Example: show the first "showInList" field as a "title" -->
            <!-- Or do something like item[titleField.name] if you want a single main field -->
            <h2>
                {{ item[listFields[0]?.name] || item.id }} <!-- Now using Angular syntax -->
            </h2>
        </ion-card-header>
        <ion-card-content>
            <!-- display all fields that have showInList = true -->
            <p *ngFor="let field of listFields">
                <strong>{{ field.name }}:</strong> {{ item[field.name] }}
            </p>

            <!-- If you still want custom logic for user images, add that here -->
            <div class="single-row-list" *ngIf="item.userName">
                <div class="createdByAvatar">
                    <img [src]="getAssociatedImage(item)" />
                </div>
                <div class="usernameInAList">
                    {{ item.userName }}
                </div>
            </div>
        </ion-card-content>
    </ion-card>

    <hr />
    Generated by Savvato Ionic Schematics, baby.
</ion-content>

<ion-footer>
    <ion-toolbar id="bottom-toolbar" color="light">
        <ion-button (click)="onHomeBtnClicked()" fill="clear">
            <ion-icon name="albums"></ion-icon>
        </ion-button>
    </ion-toolbar>
</ion-footer>
